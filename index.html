<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chang@ - Conectando Trabajo Independiente y Seguridad Social</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for Uber-like map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Core CSS -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-container"><span class="logo-text">chang<span class="logo-accent">@</span></span></div>
            <nav class="nav-menu">
                <a href="#agent-section" class="nav-item active" data-view="agent-section"><i data-lucide="brain-circuit"></i><span>Motor Agéntico</span></a>
                <a href="#map-section" class="nav-item" data-view="map-section"><i data-lucide="map-pin"></i><span>Mapa Activo</span></a>
                <a href="#changas-section" class="nav-item" data-view="changas-section"><i data-lucide="briefcase"></i><span id="nav-changas-label">Mis Changas</span></a>
                <a href="#receipts-section" class="nav-item" data-view="receipts-section"><i data-lucide="file-text"></i><span id="nav-receipts-label">Monotributo & Facturas</span></a>
                <a href="#contributions-section" class="nav-item" data-view="contributions-section"><i data-lucide="heart-pulse"></i><span id="nav-contributions-label">Aportes Sociales</span></a>
            </nav>
            <button id="reset-demo-btn" class="reset-demo-btn" type="button" title="Borra los datos guardados y restaura la demostración"><i data-lucide="rotate-ccw"></i><span>Reiniciar demostración</span></button>
            <div class="user-profile-summary"><div class="avatar"><img src="https://api.dicebear.com/7.x/bottts/svg?seed=carlos" alt="Carlos Avatar"></div><div class="profile-info"><span class="profile-name">Carlos Gómez</span><span class="profile-role">Changador • Cat. B</span></div></div>
        </aside>
        <main class="main-content">
            <header class="app-header"><div class="header-left"><button class="mobile-menu-btn" id="mobile-menu-toggle"><i data-lucide="menu"></i></button><h1 class="current-view-title">Motor Agéntico</h1></div><div class="header-right"><div class="mode-toggle-container"><span class="mode-label client-label">Cliente</span><button class="mode-switch" id="mode-switch"><span class="switch-thumb"></span></button><span class="mode-label worker-label">Changador</span></div><div class="notification-wrapper"><button class="icon-btn" id="notif-btn"><i data-lucide="bell"></i><span class="notification-badge" id="notif-count">0</span></button><div class="notification-dropdown hidden" id="notif-dropdown"><div class="notif-header"><h3>Notificaciones</h3><button id="clear-notif">Limpiar</button></div><div class="notif-list" id="notif-list"></div></div></div></div></header>
            <div class="content-wrapper">
                <section id="agent-section" class="app-view active"><div class="agent-dashboard-container" id="agent-dashboard"></div></section>
                <section id="map-section" class="app-view"><div id="map" class="uber-map"></div><div id="map-controls"></div></section>
                <section id="changas-section" class="app-view"><div class="section-header"><h2>Historial de Changas</h2></div><div class="table-container"><table class="data-table"><thead><tr><th>ID</th><th>Servicio</th><th>Fecha</th><th>Contraparte</th><th>Monto</th><th>Estado</th><th>Factura</th></tr></thead><tbody id="changas-table-body"></tbody></table></div></section>
                <section id="receipts-section" class="app-view"><div id="receipts-app"></div></section>
                <section id="contributions-section" class="app-view"><div id="contributions-app"></div></section>
            </div>
        </main>
    </div>
    <div id="afip-invoice-print-container" class="hidden"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="./robustness.js"></script>
    <script src="./storage.js"></script>
    <script src="./domain-model.js"></script>
    <script src="./capacity.js"></script>
    <script src="./app.js"></script>
    <script src="./map.js"></script>
    <script src="./assistant.js"></script>
    <script src="./agent-dashboard.js"></script>
    <script src="./role-experience.js"></script>
    <script src="./receipts.js"></script>
    <script src="./contributions.js"></script>
</body>
</html>
